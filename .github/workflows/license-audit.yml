#
# Auditoria de licenças e SBOM, independente do workflow de release (não assina nem publica nada).
# Roda em todo pull request, em push na main que mexa em dependências ou avisos, e manualmente
# (Actions › Auditoria de licenças › Run workflow):
#   1. confere o Gradle Wrapper;
#   2. gera o SBOM CycloneDX (build/reports/sbom.json) com as dependências efetivamente resolvidas;
#   3. lista as versões resolvidas no APK de release, no desugar (copiado para o APK), no APK de teste
#      e nos testes;
#   4. confere cada componente contra a política revisada (third_party/license-policy.json): dependência
#      ou versão nova sem revisão, licença desconhecida ou alterada, licença incompatível no APK,
#      componente de teste vazando para o APK e aviso ausente dentro do app;
#   5. confere se o código-fonte registrado do desugar_jdk_libs é o da versão usada.
# O relatório aparece no resumo da execução; SBOM, árvores e relatório ficam no artefato "auditoria-licencas".
#
# Segurança: `pull_request` (nunca `pull_request_target`), só leitura, sem Secrets, nada gravado no
# repositório. Actions fixadas pelo SHA completo do commit (versão no comentário). Para atualizar: escolher
# a versão nova, obter o SHA com `git ls-remote --tags https://github.com/<dono>/<action> 'refs/tags/vX.Y.Z*'`
# (em tag anotada, a linha terminada em ^{}), trocar SHA e comentário e conferir o workflow no PR.
name: Auditoria de licenças

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'third_party/**'
      - 'tools/license-audit/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/res/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/license-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Conferir o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Cache do Gradle pelo próprio setup-java (MIT).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: SBOM e dependências resolvidas
        run: |
          set -o pipefail
          ./gradlew --no-daemon --init-script tools/license-audit/audit.init.gradle.kts \
            :app:cyclonedxDirectBom :app:kalResolvedDependencies 2>&1 | tee gradle.log
          mkdir -p build/reports auditoria
          cp app/build/reports/cyclonedx-direct/bom.json build/reports/sbom.json
          cp build/reports/sbom.json auditoria/sbom.json
          cp app/build/reports/license-audit/resolved.json auditoria/resolved.json
          for c in releaseRuntimeClasspath coreLibraryDesugaring debugRuntimeClasspath debugUnitTestRuntimeClasspath debugAndroidTestRuntimeClasspath; do
            ./gradlew --no-daemon -q :app:dependencies --configuration "$c" > "auditoria/arvore-$c.txt"
          done

      - name: Conferir licenças
        run: python3 tools/license-audit/check_licenses.py --report auditoria/relatorio-licencas.md

      - name: Código-fonte do desugar_jdk_libs registrado
        run: |
          v=$(sed -n 's/^desugar *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)
          grep -q "^Versão: $v " third_party/licenses/desugar_jdk_libs/SOURCE.txt || {
            echo "::error::desugar_jdk_libs $v em gradle/libs.versions.toml, mas third_party/licenses/desugar_jdk_libs/SOURCE.txt registra outra versão. Atualize versão e commit do código-fonte."
            exit 1
          }

      - name: Guardar SBOM e relatórios
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: auditoria-licencas
          path: auditoria/
          if-no-files-found: warn

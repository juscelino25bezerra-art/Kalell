name: Release

# Gera o APK de release assinado e publica num GitHub Release.
# - push de uma tag v* (ex.: v6.0.1) → release com esse nome
# - "Run workflow" na aba Actions → pré-release teste-<número da execução>
# - pull request → só builda e anexa o APK à execução (não publica)
# Assina com os secrets KALENDRIUM_* se existirem; senão, com a chave de TESTE em ci/ (ver ci/README.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KALENDRIUM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KALENDRIUM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KALENDRIUM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KALENDRIUM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KALENDRIUM_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KALENDRIUM_STORE_PASSWORD=$STORE_PASSWORD"
              echo "KALENDRIUM_KEY_ALIAS=$KEY_ALIAS"
              echo "KALENDRIUM_KEY_PASSWORD=$KEY_PASSWORD"
              echo "CHAVE=produção (secrets)"
            } >> "$GITHUB_ENV"
          else
            {
              echo "KALENDRIUM_STORE_FILE=ci/kalendrium-teste.jks"
              echo "KALENDRIUM_STORE_PASSWORD=kalendrium-teste"
              echo "KALENDRIUM_KEY_ALIAS=kalendrium-teste"
              echo "KALENDRIUM_KEY_PASSWORD=kalendrium-teste"
              echo "CHAVE=TESTE (ci/kalendrium-teste.jks)"
            } >> "$GITHUB_ENV"
          fi

      - name: Build do release
        run: ./gradlew --no-daemon assembleRelease

      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Anexar APK à execução
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kalendrium-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"; EXTRA=""
          else
            TAG="teste-$GITHUB_RUN_NUMBER"; EXTRA="--prerelease"
          fi
          APK="kalendrium-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Kalendrium $TAG" $EXTRA \
            --notes "APK de release assinado com a chave: $CHAVE. Commit $GITHUB_SHA."

name: Release

# Gera o APK de release assinado e publica num GitHub Release.
# - push de uma tag v* (ex.: v6.0.1) → release com esse nome
# - "Run workflow" na aba Actions → pré-release teste-<número da execução>
# - pull request → só builda e anexa o APK à execução (não publica)
# Assina com os secrets KALELL_* se existirem; senão, com a chave de TESTE em ci/ (ver ci/README.md).
# Cada release publicado leva também o código-fonte do desugar_jdk_libs (GPL 2.0 com Classpath Exception),
# cujo código vai dentro do APK: ver third_party/licenses/desugar_jdk_libs/SOURCE.txt.
# Actions fixadas pelo SHA do commit (versão no comentário); como atualizar: .github/workflows/license-audit.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # cache open source (MIT); o padrão do v6 é um cache proprietário
          cache-provider: basic

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KALELL_KEYSTORE_BASE64 || secrets.KALENDRIUM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KALELL_STORE_PASSWORD || secrets.KALENDRIUM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KALELL_KEY_ALIAS || secrets.KALENDRIUM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KALELL_KEY_PASSWORD || secrets.KALENDRIUM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KALELL_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KALELL_STORE_PASSWORD=$STORE_PASSWORD"
              echo "KALELL_KEY_ALIAS=$KEY_ALIAS"
              echo "KALELL_KEY_PASSWORD=$KEY_PASSWORD"
              echo "CHAVE=produção (secrets)"
            } >> "$GITHUB_ENV"
          else
            {
              echo "KALELL_STORE_FILE=ci/kalendrium-teste.jks"
              echo "KALELL_STORE_PASSWORD=kalendrium-teste"
              echo "KALELL_KEY_ALIAS=kalendrium-teste"
              echo "KALELL_KEY_PASSWORD=kalendrium-teste"
              echo "CHAVE=TESTE (ci/kalendrium-teste.jks)"
            } >> "$GITHUB_ENV"
          fi

      - name: Testes (lógica e controlador)
        run: |
          set -o pipefail
          # erros de compilação e testes que falharam viram anotações (aparecem no resumo da execução)
          if ! ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-test.log; then
            grep -E '^e: ' gradle-test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E ' FAILED$' gradle-test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -A3 -E ' FAILED$' gradle-test.log | grep -vE ' FAILED$|^--$' | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Build do release
        run: ./gradlew --no-daemon assembleRelease

      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Anexar APK à execução
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kalell-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"; EXTRA=""
          else
            TAG="teste-$GITHUB_RUN_NUMBER"; EXTRA="--prerelease"
          fi
          APK="kalell-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # código-fonte do desugar_jdk_libs que vai no APK (GPL 2.0, seção 3: no mesmo lugar que o binário)
          DV=$(sed -n 's/^desugar *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)
          DC=$(sed -n 's/^Commit da versão: \([0-9a-f]\{40\}\)$/\1/p' third_party/licenses/desugar_jdk_libs/SOURCE.txt)
          grep -q "^Versão: $DV " third_party/licenses/desugar_jdk_libs/SOURCE.txt && [ -n "$DC" ] || {
            echo "::error::Código-fonte do desugar_jdk_libs $DV não registrado em third_party/licenses/desugar_jdk_libs/SOURCE.txt"; exit 1; }
          SRC="desugar_jdk_libs-$DV-codigo-fonte.tar.gz"
          curl -fsSL --retry 3 -o "$SRC" "https://github.com/google/desugar_jdk_libs/archive/$DC.tar.gz"
          gh release create "$TAG" "$APK" "$SRC" --target "$GITHUB_SHA" --title "Kalell $TAG" $EXTRA \
            --notes "APK de release assinado com a chave: $CHAVE. Commit $GITHUB_SHA. Código-fonte do Kalell: este repositório nesta tag. $SRC: código-fonte do desugar_jdk_libs incluído no APK (GPL 2.0 com Classpath Exception)."
